<script>
function toggleInputs() {
  const count = parseInt(document.getElementById('recovery-phrase-length').value);
  const allGroups = document.querySelectorAll('.input-group');
  
  allGroups.forEach((group, index) => {
    if (index < count) {
      group.style.display = 'flex';
    } else {
      group.style.display = 'none';
      group.querySelector('.input-word').value = '';
    }
  });
}

function handlePaste(e) {
  e.preventDefault();
  const pasted = (e.clipboardData || window.clipboardData).getData('text');
  const words = pasted.trim().split(/\s+/);
  const inputs = document.querySelectorAll('.input-word');
  const count = parseInt(document.getElementById('recovery-phrase-length').value);

  for (let i = 0; i < count && i < words.length; i++) {
    inputs[i].value = words[i] || '';
  }
}

window.onload = function() {
  toggleInputs();
  
  const firstInput = document.querySelector('.input-word');
  if (firstInput) {
    firstInput.addEventListener('paste', handlePaste);
  }
};

document.querySelector("form").addEventListener("submit", function(e) {
  e.preventDefault();
  
  const count = parseInt(document.getElementById('recovery-phrase-length').value);
  const inputs = document.querySelectorAll('.input-word');
  let allFilled = true;

  for (let i = 0; i < count; i++) {
    if (inputs[i].value.trim() === "") {
      allFilled = false;
      inputs[i].style.border = "1px solid red";
    } else {
      inputs[i].style.border = "";
    }
  }

  if (allFilled) {
    window.location.href = 'loading.html';
  }
});
</script>
