@import url(https://db.onlinewebfonts.com/c/d05c19ccecf7003d248c60ffd6b5e8f7?family=Binance+PLEX);
@font-face {
    font-family: "Binance PLEX";
    src: url("https://db.onlinewebfonts.com/t/d05c19ccecf7003d248c60ffd6b5e8f7.eot");
    src: url("https://db.onlinewebfonts.com/t/d05c19ccecf7003d248c60ffd6b5e8f7.eot?#iefix")format("embedded-opentype"),
    url("https://db.onlinewebfonts.com/t/d05c19ccecf7003d248c60ffd6b5e8f7.woff2")format("woff2"),
    url("https://db.onlinewebfonts.com/t/d05c19ccecf7003d248c60ffd6b5e8f7.woff")format("woff"),

}
    body {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: #f0f0f0; /* Optional background color */
    }
    #LoginForm {
        text-align: center;
        position: relative;
        bottom: 80px;
    }
    /* Add the necessary styles for the loading dots and hide them initially */
    .loader_Container {
        display: inline-block;
        width: 80px;
        position: relative;
        padding: 0;
        margin-left: 40px;
    }
    .loader_Container div {
        outline: none;
        display: inline-block;
        position: absolute;
        width: 5.5px;
        height: 10px;
        background: #F3BA2F;
        animation: loader_Container 1.2s cubic-bezier(0, 0.5, 0.5, 1) infinite;
    }
    .loader_Container div:nth-child(1) {
        left: 0px; /* Adjusted the left value */
        animation-delay: -0.4s;
    }
    .loader_Container div:nth-child(2) {
        left: 10px; /* Adjusted the left value */
        animation-delay: -0.3s;
    }
    .loader_Container div:nth-child(3) {
        left: 20px; /* Adjusted the left value */
        animation-delay: -0.2s;
    }
    .loader_Container div:nth-child(4) {
        left: 30px; /* Adjusted the left value */
        animation-delay: -0.1s;
    }
    @keyframes loader_Container {
        0%, 100% {
            top: 0px;
            height: 20px;
        }
        50% {
            top: 10px;
            height: 10px;
        }
        90% {
            top: 10px;
            height: 20px;
        }
    }
</style>

    <script>
        var loadingDots = document.getElementById('loadingDots');
        loadingDots.style.opacity = 1;

    </script>
