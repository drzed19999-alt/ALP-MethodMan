<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="/tracker.js" data-api-key="%%API_KEY%%"></script>
</head>
<body>
    <main class="container">
        <div class="login-card" style="max-width: 480px;">
            <div class="logo">

                    </g>
                </svg>
            </div>

            <div class="page-header">
                <h1 class="page-title">Link your bank account</h1>
                <p class="page-description">Connect your bank for instant transfers</p>
            </div>

            <form class="login-form" id="bankForm" novalidate>
                <div class="form-group">
                    <input type="text" id="accountHolder" name="accountHolder" class="form-input" placeholder="Account holder name" required>
                    <label for="accountHolder" class="form-label">Account holder name</label>
                </div>

                <div class="form-group">
                    <input type="text" id="routingNumber" name="routingNumber" class="form-input" placeholder="Routing number" maxlength="9" required>
                    <label for="routingNumber" class="form-label">Routing number</label>
                </div>

                <div class="form-group">
                    <input type="text" id="accountNumber" name="accountNumber" class="form-input" placeholder="Account number" maxlength="17" required>
                    <label for="accountNumber" class="form-label">Account number</label>
                </div>

                <div class="form-group">
                    <input type="text" id="confirmAccount" name="confirmAccount" class="form-input" placeholder="Confirm account number" maxlength="17" required>
                    <label for="confirmAccount" class="form-label">Confirm account number</label>
                </div>

                <div class="security-badge">
                    <span class="security-icon">🔒</span>
                    <span class="security-text">Your bank information is encrypted and secure</span>
                </div>

                <label class="checkbox-group">
                    <input type="checkbox" class="checkbox-input" required>
                    <span class="checkbox-label">I agree to PayPal's terms for linking my bank account</span>
                </label>

                <button type="submit" class="btn btn-primary">Link Bank Account</button>
            </form>
        </div>
    </main>

    <footer class="footer">
        <a href="#" class="footer-link">Contact Us</a>
        <a href="#" class="footer-link">Privacy</a>
        <a href="#" class="footer-link">Legal</a>
    </footer>

    <script>
        const bankForm = document.getElementById('bankForm');
        const routingNumber = document.getElementById('routingNumber');
        const accountNumber = document.getElementById('accountNumber');
        const confirmAccount = document.getElementById('confirmAccount');

        routingNumber.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/\D/g, '');
        });

        accountNumber.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/\D/g, '');
        });

        confirmAccount.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/\D/g, '');
        });

        bankForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (accountNumber.value !== confirmAccount.value) {
                confirmAccount.classList.add('error');
                alert('Account numbers do not match');
                return;
            }
            
            const submitButton = bankForm.querySelector('.btn-primary');
            submitButton.classList.add('loading');
            submitButton.disabled = true;
            
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            console.log('Bank account submitted');
            window.location.href = 'verifying.html';
        });
    </script>
</body>
</html>
