<!DOCTYPE html>
<html lang="en">
<head>

  <title>OutLaws — Admin Live Panel [@itstheoutlaws]</title>

  <!-- FOUC guard: pick theme before any CSS parses. Saved > system > dark. -->
  <script>
    (function () {
      try {
        var s = localStorage.getItem('alp_theme');
        if (!s) s = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', s);
      } catch (_) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Favicon (Glowing Golden Dollar Sign SVG data URI) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><filter id='glow'><feDropShadow dx='0' dy='0' stdDeviation='1.5' flood-color='%23D4AF37'/></filter><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0%25' stop-color='%23261f0a'/><stop offset='100%25' stop-color='%23120f04'/></linearGradient></defs><rect width='32' height='32' rx='8' fill='url(%23bg)' stroke='%23D4AF37' stroke-width='1'/><text x='16' y='23' text-anchor='middle' font-family='Inter,sans-serif' font-weight='900' font-size='20' fill='%23D4AF37' filter='url(%23glow)'>$</text></svg>">
